<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gastos | Dazujo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <img src="assets/logo_dazujo_azul.png" alt="Dazujo" class="logo" />
      <select id="marca-selector" class="marca-selector-header" aria-label="Marca"></select>
      <nav class="nav">
        <a href="index.html" data-marca-dazujo-only>Cuentas por Pagar</a>
        <a href="gastos.html" class="active">Gastos</a>
        <a href="cierre.html">Cierre de Mes</a>
        <a href="proyeccion.html" data-marca-dazujo-only>Proyeccion Mensual</a>
        <a href="usuarios.html" data-admin-only>Usuarios</a>
      </nav>
      <div class="user-box">
        <span data-user-name></span>
        <button type="button" id="logout-btn" class="secondary small">Salir</button>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Nuevo gasto</h2>
      <form id="gasto-form">
        <input type="hidden" id="gasto-id" />
        <label class="checkbox-label" id="compartido-toggle-wrap">
          <input type="checkbox" id="es-compartido" />
          Dividir este gasto entre varias clinicas
        </label>
        <div class="grid">
          <label id="sucursal-wrap">
            Sucursal
            <select id="sucursal" required></select>
          </label>
          <label id="modo-compartido-wrap" hidden>
            Como dividir
            <select id="modo-compartido">
              <option value="igual">Partes iguales</option>
              <option value="cantidad">Cantidad</option>
              <option value="porcentaje">Porcentaje</option>
            </select>
          </label>
          <label id="sucursales-compartido-wrap" hidden>
            <span id="sucursales-compartido-label">Clinicas que comparten el gasto</span>
            <div id="sucursales-compartido" class="checkbox-grid"></div>
          </label>
          <label>
            Tipo de gasto
            <select id="tipo_gasto" required></select>
          </label>
          <label>
            Concepto
            <input type="text" id="concepto" required />
          </label>
          <label>
            Fecha
            <input type="date" id="fecha" required />
          </label>
          <label id="monto-wrap">
            <span id="monto-label">Monto</span>
            <input type="number" id="monto" step="0.01" min="0" required />
          </label>
          <label>
            Comprobante (foto) <span class="opcional">(opcional)</span>
            <input type="file" id="comprobante" accept="image/*" />
            <span id="comprobante-actual" class="opcional"></span>
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Guardar</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Cancelar edicion</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Gastos registrados</h2>
        <div class="toolbar-actions">
          <select id="filtro-sucursal">
            <option value="">Todas las sucursales</option>
          </select>
          <select id="filtro-mes">
            <option value="">Todos los meses</option>
          </select>
          <select id="filtro-anio">
            <option value="">Todos los años</option>
          </select>
          <a href="/api/gastos/export/csv" id="export-csv" class="button">Exportar CSV</a>
          <a href="/api/gastos/export/xlsx" id="export-xlsx" class="button">Exportar Excel</a>
        </div>
      </div>
      <div class="table-wrapper">
        <table id="tabla-gastos">
          <thead>
            <tr>
              <th>Sucursal</th>
              <th>Tipo de gasto</th>
              <th>Concepto</th>
              <th>Fecha</th>
              <th>Monto</th>
              <th>Compartido</th>
              <th>Comprobante</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>
      <div class="paginacion">
        <button type="button" id="pagina-anterior" class="small secondary">‹ Anterior</button>
        <span id="pagina-info"></span>
        <button type="button" id="pagina-siguiente" class="small secondary">Siguiente ›</button>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="marca.js"></script>
  <script src="gastos.js"></script>
</body>
</html>
